/* Clases nuevas (Perfil, Maicito) */
.bg-\[\#DC2626\]{background-color:#DC2626}
.bg-\[\#FAFAFA\]{background-color:#FAFAFA}
.bg-\[\#FEF2F2\]{background-color:#FEF2F2}
.bg-\[\#FEFCE8\]{background-color:#FEFCE8}
.bg-\[\#FFF7ED\]{background-color:#FFF7ED}
.block{display:block}
.border-\[\#B91C1C\]{border-color:#B91C1C}
.border-\[\#EEEEEE\]{border-color:#EEEEEE}
.border-\[\#FED7AA\]{border-color:#FED7AA}
.col-span-2{grid-column:span 2 / span 2}
.cursor-pointer{cursor:pointer}
.grid-cols-6{grid-template-columns:repeat(6,minmax(0,1fr))}
.h-3\.5{height:.875rem}
.h-\[76px\]{height:76px}
.w-\[76px\]{width:76px}
.leading-snug{line-height:1.375}
.mt-0\.5{margin-top:.125rem}
.p-2{padding:.5rem}
.shadow-\[0_3px_0_\#46A302\]{box-shadow:0 3px 0 #46A302}
.shadow-\[0_4px_0_\#46A302\]{box-shadow:0 4px 0 #46A302}
.shadow-\[0_8px_24px_rgba\(0\,0\,0\,0\.04\)\]{box-shadow:0 8px 24px rgba(0,0,0,0.04)}
.text-\[\#166534\]{color:#166534}
.text-\[\#1F1147\]{color:#1F1147}
.text-\[\#555\]{color:#555}
.text-\[\#6D28D9\]{color:#6D28D9}
.text-\[\#7C3AED\]{color:#7C3AED}
.text-\[17px\]{font-size:17px}
.text-\[19px\]{font-size:19px}
.text-\[42px\]{font-size:42px}
.tracking-wide{letter-spacing:.025em}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.underline{text-decoration-line:underline}
/* Barra superior: el nombre no empuja al XP */
.sticky.z-30 .fredoka{white-space:nowrap}
@media (max-width:359px){.sticky.z-30 span.fredoka{font-size:14px!important}}
@media (max-width:330px){.sticky.z-30 span.fredoka{display:none}}
/* Tarjetas con encabezado + etiqueta: permitir salto de línea en pantallas chicas */
@media (max-width:480px){
  .flex.items-center.gap-3.mb-2{flex-wrap:wrap}
  .flex.items-center.gap-3.mb-2>.ml-auto{margin-left:0}
}
/* Pantalla horizontal en teléfono: barras más compactas */
@media (max-height:480px) and (orientation:landscape){
  .mm-main{padding-bottom:110px}
}
